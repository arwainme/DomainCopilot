name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore DomainCopilot.slnx

      - name: Build
        run: dotnet build DomainCopilot.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test DomainCopilot.slnx --configuration Release --no-build

      - name: Check vulnerable packages
        run: dotnet list DomainCopilot.slnx package --vulnerable --include-transitive
